[project]
name = "search-weather-agent"
version = "1.0.0"
description = "FastAPI backend for the Search + Weather agentic AI assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic>=2.14.2,<3",
    "pydantic-settings>=2.16.2,<3",
    "httpx>=0.28.1,<0.29",
    "langchain>=1.4.8,<2",
    "langchain-core>=1.7.4,<2",
    "langchain-openai>=1.7.3,<2",
    "langgraph>=1.2.19,<2",
    "openai>=3.42.1,<4",
    "tavily-python>=0.8.5,<0.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<2",
    "respx>=0.23.1,<0.24",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.1,<3",
    "pytest-cov>=7,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real external APIs (requires credentials; skipped by default)"]
addopts = "-m 'not live'"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["tavily.*"]
ignore_missing_imports = true
